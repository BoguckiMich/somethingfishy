      :root { --bg: #1b2b3a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #11161c; color: #e8e2d4; font: 14px system-ui, sans-serif; overflow-x: hidden; }
      main { max-width: 560px; margin: 0 auto; padding: 8px; }
      h1 { font-size: 18px; margin: 4px 0 8px; }
      h2 { font-size: 16px; margin: 0 0 2px; }
      .controls { position: sticky; top: 0; z-index: 5; background: #11161cf0; padding: 6px 0 8px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; border-bottom: 1px solid #333; }
      .controls label { display: inline-flex; gap: 4px; align-items: center; }
      .controls input[type=range] { width: 80px; }
      .block { margin: 18px 0; padding-top: 10px; border-top: 2px solid #444; }
      .meta { font-size: 12px; color: #a9b4bf; margin: 0 0 6px; }
      .flag { color: #ffb0a0; font-weight: 600; }
      .size { margin: 10px 0 2px; font-weight: 600; color: #ffd35a; }
      .tag { font-size: 11px; color: #8fa3b5; margin: 6px 0 1px; }
      .stage { background: var(--bg); padding: 8px; border-radius: 4px; overflow: hidden; }
      .dom { color: #fff6e4; margin: 0 0 4px; overflow-wrap: anywhere; }
      .dom.wrap { width: 320px; max-width: 100%; }
      .cv { display: block; width: 100%; max-width: 100%; }
      .cv.old { image-rendering: pixelated; }

    <main>
      <h1>Font sheet (dev only)</h1>
      <div class="controls" id="controls"></div>
      <div id="sheet"></div>
    </main>
